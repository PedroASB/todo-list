<!DOCTYPE html>
<html lang="en" style="background-color: #625fad">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
</head>
<body>
    <h1 id="main-title">Todo List</h1>
    <div id="main-content">
        <h2 id="project-name">
            <span></span>
            <img src="./assets/icons/edit-icon-lighter.svg" alt="Edit Project" class="edit-icon icon" id="edit-project">
        </h2>
        <div id="projects" class="section">
            <h3 class="section-title">Projects</h3>
            <button type="button" id="add-project" class="add-button"><div class="plus">+</div><span>Add project</span></button>
        </div>
        <div id="todos" class="section">
            <h3 class="section-title">Todos</h3>
            <button type="button" id="add-todo" class="add-button"><div class="plus">+</div><span>Add todo</span></button>
            <div id="todo-list">
            </div>
            <template id="todo-template">
                <div class="todo">
                    <div class="tag"></div>
                    <div class="card">
                        <div class="header">
                            <input type="checkbox" name="" class="checkbox">
                            <div class="main-info">
                                <div class="title"></div>
                                <div class="date">
                                    <img alt="Calendar" class="calendar-icon decorative-icon">
                                    <span></span>
                                </div>
                            </div>
                            <div class="icons">
                                <img alt="Expand" class="expand-collapse-icon icon">
                                <img alt="Edit" class="edit-icon icon">
                                <img alt="Delete" class="delete-icon icon">
                            </div>
                        </div>
                        <div class="details">
                            <p class="description"></p>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <dialog id="add-todo-dialog" class="todo-dialog">
        <form method="dialog" id="add-todo-form" class="todo-form">
            <h3>Add Todo</h3>
            <input type="text" name="title" id="add-todo-title" maxlength="40" placeholder="Add a new task" required>
            <textarea name="description" id="add-todo-description" class="todo-description" rows="3" cols="30" placeholder="Description" wrap="soft" maxlength="150"></textarea>
            <fieldset id="add-priority-radios" class="priority-radios">
                <label for="add-todo-priority-1" class="radio">
                    <input type="radio" name="priority" value="1" id="add-todo-priority-1" checked>
                    <span>Priority 1</span>
                </label>
                <label for="add-todo-priority-2" class="radio">
                    <input type="radio" name="priority" value="2" id="add-todo-priority-2">
                    <span>Priority 2</span>
                </label>
                <label for="add-todo-priority-3" class="radio">
                    <input type="radio" name="priority" value="3" id="add-todo-priority-3">
                    <span>Priority 3</span>
                </label>
            </fieldset>
            <label for="add-todo-date">
                <span>Due date:</span>
                <input type="date" name="date" id="add-todo-date"  min="2025-01-01" max="2050-12-31">
            </label>
            <div class="buttons">
                <button type="submit" value="cancel" formnovalidate>Cancel</button>
                <button type="submit" value="confirm">Add</button>
            </div>
        </form>
    </dialog>

    <dialog id="edit-todo-dialog" class="todo-dialog">
        <form method="dialog" id="edit-todo-form" class="todo-form">
            <h3>Edit Todo</h3>
            <input type="text" name="title" id="edit-todo-title" maxlength="40" placeholder="New task name" required>
            <textarea name="description" id="edit-todo-description" class="todo-description" rows="3" cols="30" placeholder="Description" wrap="soft" maxlength="150"></textarea>
            <fieldset id="edit-priority-radios" class="priority-radios">
                <label for="edit-todo-priority-1" class="radio">
                    <input type="radio" name="priority" value="1" id="edit-todo-priority-1" checked>
                    <span>Priority 1</span>
                </label>
                <label for="edit-todo-priority-2" class="radio">
                    <input type="radio" name="priority" value="2" id="edit-todo-priority-2">
                    <span>Priority 2</span>
                </label>
                <label for="edit-todo-priority-3" class="radio">
                    <input type="radio" name="priority" value="3" id="edit-todo-priority-3">
                    <span>Priority 3</span>
                </label>
            </fieldset>
            <label for="edit-todo-date">
                <span>Due date:</span>
                <input type="date" name="date" id="edit-todo-date"  min="2025-01-01" max="2050-12-31">
            </label>
            <div class="buttons">
                <button type="submit" value="cancel" formnovalidate>Cancel</button>
                <button type="submit" value="confirm">Done</button>
            </div>
        </form>
    </dialog>

    <dialog id="add-project-dialog" class="project-dialog">
        <form method="dialog" id="add-project-form" class="project-form">
            <h3>Add Project</h3>
            <input type="text" name="name" id="add-project-name" maxlength="30" placeholder="New project name" required>
            <div class="buttons">
                <button type="submit" value="cancel" formnovalidate>Cancel</button>
                <button type="submit" value="confirm">Add</button>
            </div>
        </form>
    </dialog>

    <dialog id="edit-project-dialog" class="project-dialog">
        <form method="dialog" id="edit-project-form" class="project-form">
            <h3>Edit Project</h3>
            <input type="text" name="name" id="edit-project-name" maxlength="30" placeholder="New project name" required>
            <div class="buttons">
                <button type="submit" value="cancel" formnovalidate>Cancel</button>
                <button type="submit" value="delete" formnovalidate>Delete</button>
                <button type="submit" value="confirm">Done</button>
            </div>
        </form>
    </dialog>
</body>
</html>
